[project]
name = "langgraph-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "coolasid", email = "siddeshp388@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "colorama>=0.4.6",
    "dotenv>=0.9.9",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.7.2",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.15",
    "langgraph-cli[inemem,inmem]>=0.4.35",
]

[project.scripts]
langgraph-agent = "langgraph_agent:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
